name: Upgrade Android CLI to Tailscale v1.102.4

on:
  push:
    branches:
      - 1.98.8-android-dev
    paths:
      - .github/workflows/upgrade_tailscale_1_102_4.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Android branch
        uses: actions/checkout@v4
        with:
          ref: 1.102.3-android-dev
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check Android patch applies cleanly to v1.102.4
        run: ./scripts/android.sh update --dry-run v1.102.4

      - name: Port Android patch to v1.102.4
        run: ./scripts/android.sh update v1.102.4

      - name: Verify preserved Android adaptations
        run: |
          test "$(cat VERSION.txt)" = "1.102.4"
          grep -Fq 'gbthui/tailscale-android-cli/releases' clientupdate/clientupdate_android.go
          grep -Fq 'runtime.GOOS == "android"' wgengine/router/osrouter/router_linux.go
          git diff --check v1.102.4..HEAD

      - name: Verify Android arm64 build
        run: ./scripts/android.sh check arm64

      - name: Build arm and arm64
        run: |
          ./scripts/android.sh build --upx arm
          ./scripts/android.sh build --upx arm64
          eval "$(./build_dist.sh shellvars)"
          tar -czf "dist/tailscale_${VERSION_SHORT}_arm.tgz" -C dist --transform='s/tailscaled.arm/tailscaled/' tailscaled.arm
          tar -czf "dist/tailscale_${VERSION_SHORT}_arm64.tgz" -C dist --transform='s/tailscaled.arm64/tailscaled/' tailscaled.arm64
          ls -lh dist

      - name: Publish upgraded development branch
        run: git push origin HEAD:1.102.4-android-dev

      - name: Create Android CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.102.4-android --repo gbthui/tailscale-android-cli >/dev/null 2>&1; then
            gh release delete v1.102.4-android --yes --cleanup-tag --repo gbthui/tailscale-android-cli
          fi
          gh release create v1.102.4-android \
            dist/tailscale_1.102.4_arm.tgz \
            dist/tailscale_1.102.4_arm64.tgz \
            --repo gbthui/tailscale-android-cli \
            --target 1.102.4-android-dev \
            --title "Tailscale Android CLI 1.102.4" \
            --notes "Tailscale v1.102.4 with the fork's root-Android adaptations preserved, including Android netd-compatible policy routing and self-update through gbthui/tailscale-android-cli releases."

      - name: Remove one-shot upgrade workflow
        run: |
          git fetch origin 1.98.8-android-dev
          git checkout -B 1.98.8-android-dev origin/1.98.8-android-dev
          git rm .github/workflows/upgrade_tailscale_1_102_4.yml
          git commit -m "chore: remove one-shot v1.102.4 upgrader"
          git push origin HEAD:1.98.8-android-dev
