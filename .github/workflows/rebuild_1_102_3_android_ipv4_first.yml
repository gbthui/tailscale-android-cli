name: Rebuild Android CLI v1.102.3 IPv4-first

on:
  push:
    branches:
      - 1.98.8-android-dev
    paths:
      - .github/workflows/rebuild_1_102_3_android_ipv4_first.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          ref: 1.102.3-android-dev
          fetch-depth: 0

      - name: Verify Android arm64 build
        run: ./scripts/android.sh check arm64

      - name: Build arm and arm64
        run: |
          ./scripts/android.sh build --upx arm
          ./scripts/android.sh build --upx arm64
          eval "$(./build_dist.sh shellvars)"
          tar -czf "dist/tailscale_${VERSION_SHORT}_arm.tgz" -C dist --transform='s/tailscaled.arm/tailscaled/' tailscaled.arm
          tar -czf "dist/tailscale_${VERSION_SHORT}_arm64.tgz" -C dist --transform='s/tailscaled.arm64/tailscaled/' tailscaled.arm64
          ls -lh dist

      - name: Recreate Android CLI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.102.3-android --yes --cleanup-tag --repo gbthui/tailscale-android-cli 2>/dev/null || true
          gh release create v1.102.3-android \
            dist/tailscale_1.102.3_arm.tgz \
            dist/tailscale_1.102.3_arm64.tgz \
            --repo gbthui/tailscale-android-cli \
            --target 1.102.3-android-dev \
            --title "Tailscale Android CLI 1.102.3" \
            --notes "Tailscale v1.102.3 with root-Android adaptations; Android Happy Eyeballs prefers IPv4 first while retaining IPv6 fallback."
